<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPIC TECH - حجز خدمة التركيب والأنظمة</title>
    <link rel="icon" href="../assets/images/favicon.png" type="image/png">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top right, #1e293b, #0f172a 60%, #020617);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* الهيدر الزجاجي */
        .glass-header {
            width: 90%;
            max-width: 1100px;
            margin: 25px auto 10px;
            padding: 14px 28px;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-logo {
            height: 42px;
            width: auto;
            border-radius: 8px;
        }

        .brand-name {
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #38bdf8;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: #94a3b8;
            font-size: 15px;
            font-weight: 600;
            transition: 0.3s ease;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        /* الاستمارة الزجاجية */
        .glass-container {
            max-width: 600px;
            width: 90%;
            margin: 30px auto 50px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .form-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-header h2 {
            font-size: 1.8rem;
            color: #38bdf8;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .form-header p {
            color: #94a3b8;
            font-size: 14px;
        }

        .step-box {
            margin-bottom: 20px;
        }

        .step-box label {
            display: block;
            margin-bottom: 8px;
            color: #e2e8f0;
            font-weight: 600;
            font-size: 14.5px;
        }

        .glass-input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f8fafc;
            border-radius: 10px;
            outline: none;
            font-size: 14.5px;
            transition: 0.3s;
        }

        .glass-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
            background: rgba(15, 23, 42, 0.8);
        }

        .glass-input option {
            background-color: #0f172a;
            color: #f8fafc;
        }

        .hidden {
            display: none;
        }

        .submit-btn {
            background: #38bdf8;
            color: #04121d;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            border: none;
            width: 100%;
            margin-top: 10px;
            transition: 0.3s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        .submit-btn:hover {
            background: #7dd3fc;
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- الهيدر الزجاجي -->
    <header class="glass-header" dir="ltr">
        <a href="../index.html" class="brand-container">
            <img src="../assets/images/favicon.png" alt="EPIC TECH Logo" class="brand-logo">
            <span class="brand-name">EPIC TECH</span>
        </a>
        <nav class="nav-links">
            <a href="../index.html">Home</a>
            <a href="games.html">Games</a>
        </nav>
    </header>

    <!-- الاستمارة الزجاجية -->
    <main>
        <div class="glass-container">
            <div class="form-header">
                <h2><span>💻</span> تركيب التجميعات والأنظمة</h2>
                <p>احترافية كاملة في تجميع الهاردوير وتسطيب الأنظمة</p>
            </div>
            
            <form id="assemblyForm">
                
                <!-- 1. نوع العميل -->
                <div class="step-box">
                    <label>اختر نوع العميل:</label>
                    <select id="clientType" class="glass-input" required onchange="handleClientType()">
                        <option value="">-- اختار نوع العميل --</option>
                        <option value="فرد">فرد (جهاز شخصي)</option>
                        <option value="سايبر">سايبر (Gaming Cafe)</option>
                        <option value="شركة">شركة / مكتب</option>
                    </select>
                </div>

                <!-- 1. مكمل: عدد الأجهزة (يظهر فقط لو سايبر أو شركة) -->
                <div class="step-box hidden" id="devicesCountSection">
                    <label>عدد الأجهزة المطلوب تركيبها:</label>
                    <input type="number" id="devicesCount" class="glass-input" placeholder="مثال: 15" min="1">
                </div>

                <!-- 2. مكان التركيب -->
                <div class="step-box">
                    <label>مكان التركيب:</label>
                    <select id="locationType" class="glass-input" required>
                        <option value="">-- اختار المكان --</option>
                        <option value="في المحل">في مقر المحل</option>
                        <option value="في البيت / المقر">في البيت / مقر العميل (خدمة منزلية)</option>
                    </select>
                </div>

                <!-- 3. نوع الخدمة -->
                <div class="step-box">
                    <label>نوع الخدمة المطلوبة:</label>
                    <select id="serviceScope" class="glass-input" required>
                        <option value="">-- اختار نوع الخدمة --</option>
                        <option value="تركيب تجميعة هاردوير فقط">تركيب تجميعة هاردوير فقط</option>
                        <option value="تركيب وتسطيب ويندوز وبرامج تشغيل كاملة">تركيب وتسطيب ويندوز وبرامج تشغيل كاملة (Full Setup)</option>
                    </select>
                </div>

                <!-- بيانات العميل -->
                <div class="step-box">
                    <label>الاسم بالكامل:</label>
                    <input type="text" id="custName" class="glass-input" placeholder="اكتب اسمك الكريم" required>
                </div>

                <div class="step-box">
                    <label>العنوان / رقم الهاتف:</label>
                    <input type="text" id="custDetails" class="glass-input" placeholder="العنوان بالتفصيل ورقم هاتفك" required>
                </div>

                <button type="submit" class="submit-btn">إرسال طلب التركيب عبر واتساب 💬</button>

            </form>
        </div>
    </main>

    <footer style="text-align: center; padding: 20px; color: #64748b; font-size: 13px;">
        &copy; EPIC TECH - جميع الحقوق محفوظة
    </footer>

    <!-- سكريبت التفاعل -->
    <script>
        function handleClientType() {
            const clientType = document.getElementById('clientType').value;
            const devicesSec = document.getElementById('devicesCountSection');

            if (clientType === "سايبر" || clientType === "شركة") {
                devicesSec.classList.remove('hidden');
            } else {
                devicesSec.classList.add('hidden');
                document.getElementById('devicesCount').value = "";
            }
        }

        document.getElementById('assemblyForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const clientType = document.getElementById('clientType').value;
            const devicesCount = document.getElementById('devicesCount').value;
            const locationType = document.getElementById('locationType').value;
            const serviceScope = document.getElementById('serviceScope').value;
            const name = document.getElementById('custName').value;
            const details = document.getElementById('custDetails').value;
            
            const storePhone = "201017229055";

            let message = `💻 طلب خدمة تركيب وتجميع جديد - EPIC TECH:%0A%0A`;
            message += `👤 نوع العميل: ${clientType}%0A`;
            
            if (clientType === "سايبر" || clientType === "شركة") {
                message += `🖥️ عدد الأجهزة: ${devicesCount} جهاز%0A`;
            }

            message += `📍 مكان التركيب: ${locationType}%0A`;
            message += `⚙️ تفاصيل الخدمة: ${serviceScope}%0A`;
            message += `%0A📝 اسم العميل: ${name}%0A📍 العنوان ورقم التواصل: ${details}`;

            window.open(`https://wa.me/${storePhone}?text=${message}`, '_blank');
        });
    </script>
</body>
</html>
