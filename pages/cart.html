<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة المشتريات | Epic Store</title>
    <link rel="icon" href="../assets/images/favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script>
        try { if (localStorage.getItem('epic_theme') === 'light') document.documentElement.classList.add('light-mode'); } catch (e) { }
    </script>
</head>
<style>
    main {
        overflow: visible !important;
        padding: 40px 20px 80px 20px !important;
    }

    body {
        /* نفس الخلفية بتاعتك */
        background: radial-gradient(circle at 50% 20%, rgba(60, 30, 20, 0.4), rgba(15, 23, 42, 0.9) 60%, #020617);
        background-color: #050508;

        /* دول السطور الجديدة اللي هتثبت الخلفية */
        background-attachment: fixed !important;
        background-size: cover !important;
        background-repeat: no-repeat !important;

        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    .policy-box {
        background: rgba(255, 255, 255, 0.03) !important;
        border: 1px solid rgba(168, 85, 247, 0.3) !important;
        border-radius: 20px;
        padding: 40px;
        margin: 20px auto 40px auto !important;
        width: 92%;
        backdrop-filter: blur(15px);
        color: #ffffff !important;
        text-shadow: 0 0 2px rgba(255, 255, 255, 0.4) !important;
        transition: all 0.4s ease !important;
        line-height: 1.8;
        position: relative;
    }

    .policy-box:hover {
        border-color: #a855f7 !important;
        box-shadow:
            -30px 0 50px rgba(56, 189, 248, 0.35),
            30px 0 50px rgba(236, 72, 153, 0.35),
            0 0 60px rgba(168, 85, 247, 0.5) !important;
        transform: translateY(-5px);
    }

    .policy-box h2 {
        color: #d946ef !important;
        text-shadow: 0 0 8px rgba(217, 70, 239, 0.6) !important;
        font-size: 24px;
    }

    .policy-box strong {
        color: #a855f7 !important;
        text-shadow: 0 0 5px rgba(168, 85, 247, 0.6) !important;
    }

    /* ===== كروت المنتجات في السلة ===== */
    .cart-item { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); padding: 16px; border-radius: 18px; backdrop-filter: blur(15px); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4); }
    .cart-item-img { width: 90px; height: 90px; object-fit: contain; border-radius: 12px; background: rgba(255, 255, 255, 0.06); flex-shrink: 0; }
    .cart-item-info { flex: 1; min-width: 160px; }
    .cart-item-name { font-size: 20px; font-weight: bold; color: #ffffff; line-height: 1.5; margin-bottom: 6px; font-family: Tahoma, sans-serif; }
    .cart-item-price { font-size: 15px; color: #4ade80; font-weight: bold; }
    .qty-box { display: flex; align-items: center; gap: 6px; direction: ltr; }
    .qty-box button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(56, 189, 248, 0.5); background: rgba(56, 189, 248, 0.1); color: #38bdf8; font-size: 20px; font-weight: bold; cursor: pointer; line-height: 1; }
    .qty-box button:hover { background: rgba(56, 189, 248, 0.25); }
    .qty-box input { width: 54px; height: 36px; text-align: center; font-size: 16px; font-weight: bold; color: #fff; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 10px; outline: none; -moz-appearance: textfield; }
    .qty-box input::-webkit-outer-spin-button, .qty-box input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .cart-remove { background: transparent; border: none; cursor: pointer; font-size: 20px; padding: 6px; }
    .cart-empty { text-align: center; color: #94a3b8; font-size: 18px; padding: 30px 10px; }

    /* ===== الوضع النهاري ===== */
    #themeBtn { background: transparent; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; padding: 0; }
    #themeBtn .icon-sun { display: none; }
    html.light-mode #themeBtn .icon-sun { display: block; }
    html.light-mode #themeBtn .icon-moon { display: none; }

    html.light-mode body {
        background: radial-gradient(circle at 50% 20%, rgba(186, 230, 253, 0.6), rgba(241, 245, 249, 0.95) 60%, #e2e8f0) !important;
        background-color: #f1f5f9 !important;
        color: #0f172a;
    }
    html.light-mode .main-header { background: rgba(255, 255, 255, 0.85) !important; }
    html.light-mode .main-header svg { stroke: #0f172a !important; filter: none !important; }
    html.light-mode .main-header .search-input { color: #0f172a !important; background: rgba(15, 23, 42, 0.06) !important; border-color: rgba(15, 23, 42, 0.2) !important; }
    html.light-mode .cart-item,
    html.light-mode main > div:last-child { background: rgba(255, 255, 255, 0.92) !important; border-color: rgba(15, 23, 42, 0.12) !important; box-shadow: 0 6px 20px rgba(15, 23, 42, 0.12) !important; }
    html.light-mode .cart-item-name { color: #0f172a; }
    html.light-mode .cart-item-price,
    html.light-mode #total-price { color: #15803d !important; }
    html.light-mode .cart-item-img { background: rgba(15, 23, 42, 0.05); }
    html.light-mode .qty-box button { color: #0369a1; border-color: rgba(3, 105, 161, 0.5); background: rgba(3, 105, 161, 0.08); }
    html.light-mode .qty-box input { color: #0f172a; background: #fff; border-color: rgba(15, 23, 42, 0.3); }
    html.light-mode .cart-empty { color: #475569; }

    /* ===== الوضع النهاري: قلب الكلام الأبيض والمربعات ===== */
    html.light-mode .neon-logo { color: #0f172a !important; -webkit-text-fill-color: #0f172a !important; background: none !important; text-shadow: 0 0 8px rgba(124, 58, 237, 0.45) !important; }
    html.light-mode .nav-links a { color: #334155 !important; }
    html.light-mode .nav-links a[href*="accessories"] { color: #0369a1 !important; }
    html.light-mode .main-header [style*="color: #fff"],
    html.light-mode .main-header [style*="color:#fff"],
    html.light-mode main [style*="color: #fff"]:not(.neon-cart-btn),
    html.light-mode main [style*="color:#fff"]:not(.neon-cart-btn),
    html.light-mode main [style*="color: #ccc"],
    html.light-mode main [style*="color: #aaa"],
    html.light-mode main [style*="color: #f8fafc"] { color: #0f172a !important; text-shadow: none !important; }
    html.light-mode main [style*="rgba(255, 255, 255, 0.03)"],
    html.light-mode main [style*="rgba(255,255,255,0.03)"],
    html.light-mode main [style*="rgba(255, 255, 255, 0.02)"],
    html.light-mode main [style*="rgba(255,255,255,0.02)"] { background: rgba(255, 255, 255, 0.92) !important; border-color: rgba(15, 23, 42, 0.15) !important; }
    html.light-mode ::placeholder { color: #64748b !important; opacity: 1; }
    html.light-mode .neon-cart-btn { color: #ffffff !important; }

    /* ===== الوضع النهاري: أي كلام لسه أبيض أو فاتح يتقلب غامق (بأقل أولوية، والألوان الخاصة بتفضل زي ما هي) ===== */
    html.light-mode :where(:is(.main-header, main, .hero-logo-container) *:not(.neon-cart-btn):not(.neon-cart-btn *):not(svg *):not(#cartBadge)) {
        color: #0f172a !important;
        text-shadow: none !important;
    }
</style>

<body>

    <!-- نفس الهيدر المطابق للرئيسية -->
    <header class="main-header" dir="ltr">
        <!-- الجزء الأيسر (اللوجو والبحث) -->
        <div class="header-left" style="display: flex; align-items: center; gap: 15px;">
            <a href="../index.html" class="logo-area"
                style="text-decoration: none; display: flex; align-items: center;">
                <img src="../assets/images/favicon.png" alt="EPIC TECH"
                    style="height: 45px; width: auto; border-radius: 8px;">
            </a>
            <div class="search-container" style="display: flex; align-items: center; position: relative;">
                <button id="searchIcon" class="search-btn"
                    style="background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"
                        style="filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.8));">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
                <input type="text" id="searchInput" class="search-input" placeholder="Search..."
                    style="display: none; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(256,256,256,0.2); border-radius: 20px; padding: 5px 10px; color: #fff; outline: none; margin-left: 5px;">
            </div>
        </div>

        <!-- روابط الأقسام في المنتصف -->
        <nav class="nav-links" style="display: flex; gap: 15px; align-items: center;">
            <a href="../index.html"
                style="text-decoration: none; color: #94a3b8; font-size: 15px; font-weight: 600;">Home</a>
            <a href="category.html?cat=laptops"
                style="text-decoration: none; color: #94a3b8; font-size: 15px; font-weight: 600;">Laptops</a>
            <a href="category.html?cat=desktops"
                style="text-decoration: none; color: #94a3b8; font-size: 15px; font-weight: 600;">PCs</a>
            <a href="category.html?cat=accessories"
                style="text-decoration: none; color: #38bdf8; font-size: 15px; font-weight: 600;">Accessories</a>
            <a href="category.html?cat=monitors"
                style="text-decoration: none; color: #94a3b8; font-size: 15px; font-weight: 600;">Monitors</a>
            <a href="category.html?cat=bundles"
                style="text-decoration: none; color: #94a3b8; font-size: 15px; font-weight: 600;">Bundles</a>
            <a href="category.html?cat=workstations"
                style="text-decoration: none; color: #94a3b8; font-size: 15px; font-weight: 600;">Workstations</a>
        </nav>

        <!-- الجزء الأيمن (السلة بالعداد وزر الثيم) -->
        <div class="header-right"
            style="display: flex; align-items: center; gap: 25px; flex-shrink: 0; margin-left: 10px;">
            <!-- زر الوضع النهاري / الليلي -->
            <button id="themeBtn" type="button" onclick="toggleTheme()" aria-label="تبديل الوضع">
                <svg class="icon-moon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    style="filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8));">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <svg class="icon-sun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    style="filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8));">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>

            <!-- زر السلة بالعداد (شكل نيون فخم) -->
            <a href="cart.html" class="cart-btn"
                style="position: relative; text-decoration: none; font-size: 22px; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px;">
                <!-- رسمة نيون سلة تسوق بيضاء ومضيئة -->
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"
                    style="filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8));">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span id="cartBadge"
                    style="position: absolute; top: -4px; right: -6px; background: #38bdf8; color: #04121d; font-size: 11px; font-weight: bold; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 8px rgba(56, 189, 248, 0.8); z-index: 10;">0</span>
            </a>

        </div>
    </header>

    <!-- عنوان النيون الفخم -->
    <div class="hero-logo-container" style="margin-top: 30px; margin-bottom: 20px;">
        <h1 class="neon-logo" style="font-size: 32px; text-align: center;">SHOPPING CART</h1>
    </div>

    <main style="max-width: 900px; margin: 0 auto; padding: 20px;">

        <!-- محتوى المنتجات في السلة -->
        <div id="cart-items-container" style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px;">
            <!-- المنتجات بتنزل هنا أوتوماتيك -->
        </div>

        <!-- إجمالي السلة وزر التأكيد الزجاجي -->
        <div
            style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); padding: 25px; border-radius: 20px; backdrop-filter: blur(15px); text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <h3 id="total-price" style="color: #4ade80; margin-bottom: 20px; font-size: 24px; font-weight: bold;">
                الإجمالي: 0 ج.م</h3>
            <button onclick="checkoutOrder()" class="neon-cart-btn"
                style="width: 100%; margin-top: 15px; padding: 12px 20px !important; font-size: 15px !important;">
                CONFIRM ORDER 🚀
            </button>
        </div>
    </main>

    <!-- زر التواصل العائم -->
    <div class="fab-container">
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="main-fab">
            <span class="fab-icon-plus"><img src="../assets/images/headset.png" alt="Call"></span>
            <span class="fab-icon-close">×</span>
        </label>
        <div class="fab-sub-buttons">
            <a href="https://www.facebook.com/profile.php?id=61569196895343" target="_blank"
                class="fab-btn facebook-btn" title="فيسبوك">
                <img src="../assets/images/Facebook.webp" alt="Facebook">
            </a>
            <a href="https://wa.me/201017229055" target="_blank" class="fab-btn whatsapp-btn" title="واتساب">
                <img src="../assets/images/WhatsApp.png" alt="WhatsApp">
                <a href="https://www.tiktok.com/@epictechet" target="_blank" rel="noopener noreferrer"
                    class="fab-btn tiktok-btn" title="تيك توك">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="#fff">
                        <path
                            d="M16.6 5.82s.51.5 0 0A4.278 4.278 0 0 1 15.54 3h-3.09v12.4a2.592 2.592 0 0 1-2.59 2.5c-1.42 0-2.6-1.16-2.6-2.6c0-1.72 1.66-3.01 3.37-2.48V9.66c-3.45-.46-6.47 2.22-6.47 5.64c0 3.33 2.76 5.7 5.69 5.7c3.14 0 5.69-2.55 5.69-5.7V9.01a7.35 7.35 0 0 0 4.3 1.38V7.3s-1.88.09-3.24-1.48z" />
                    </svg>
                </a>
                <button type="button" class="fab-btn scrolltop-btn" title="ارجع لفوق"
                    onclick="window.scrollTo({top:0, behavior:'smooth'})">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
        </div>
    </div>

    <!-- بنربط بالملف الأساسي المجمع بتاعنا -->
    <script src="../assets/js/main.js"></script>

    <script>
        function toggleTheme() {
            const isLight = document.documentElement.classList.toggle('light-mode');
            try { localStorage.setItem('epic_theme', isLight ? 'light' : 'dark'); } catch (e) { }
        }

        /* ===== عرض السلة: صورة + اسم كبير + تحكم في الكمية ===== */
        function cartKey() {
            return localStorage.getItem('epic_cart') !== null ? 'epic_cart' : 'cart';
        }
        function readCart() {
            try { return JSON.parse(localStorage.getItem(cartKey())) || []; } catch (e) { return []; }
        }
        function writeCart(cart) {
            localStorage.setItem(cartKey(), JSON.stringify(cart));
        }
        function itemImage(item) {
            let src = item.image || item.img || item.thumbnail || (Array.isArray(item.images) ? item.images[0] : '') || '';
            if (!src) return '';
            if (/^(https?:|data:|\.\.\/|\/)/.test(src)) return src;
            return '../' + src.replace(/^\.?\//, '');
        }
        function setQty(index, qty) {
            const cart = readCart();
            if (!cart[index]) return;
            qty = parseInt(qty, 10);
            if (isNaN(qty) || qty < 1) qty = 1;
            if (qty > 99) qty = 99;
            cart[index].quantity = qty;
            writeCart(cart);
            renderCart();
        }
        function removeItem(index) {
            const cart = readCart();
            cart.splice(index, 1);
            writeCart(cart);
            renderCart();
        }
        function renderCart() {
            const cart = readCart();
            const box = document.getElementById('cart-items-container');
            box.innerHTML = '';
            let total = 0, count = 0;

            if (cart.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'cart-empty';
                empty.textContent = 'سلة المشتريات فارغة 🛒';
                box.appendChild(empty);
            }

            cart.forEach((item, i) => {
                const qty = item.quantity || 1;
                const price = Number(item.price) || 0;
                total += price * qty;
                count += qty;

                const row = document.createElement('div');
                row.className = 'cart-item';

                const src = itemImage(item);
                if (src) {
                    const img = document.createElement('img');
                    img.className = 'cart-item-img';
                    img.src = src;
                    img.alt = item.name || '';
                    img.onerror = function () { this.style.display = 'none'; };
                    row.appendChild(img);
                }

                const info = document.createElement('div');
                info.className = 'cart-item-info';
                const nm = document.createElement('div');
                nm.className = 'cart-item-name';
                nm.textContent = item.name || '';
                const pr = document.createElement('div');
                pr.className = 'cart-item-price';
                pr.textContent = price.toLocaleString('en-US') + ' ج.م';
                info.appendChild(nm);
                info.appendChild(pr);
                row.appendChild(info);

                const q = document.createElement('div');
                q.className = 'qty-box';
                const minus = document.createElement('button');
                minus.type = 'button'; minus.textContent = '−';
                minus.onclick = () => setQty(i, qty - 1);
                const inp = document.createElement('input');
                inp.type = 'number'; inp.min = 1; inp.max = 99; inp.value = qty;
                inp.onchange = () => setQty(i, inp.value);
                const plus = document.createElement('button');
                plus.type = 'button'; plus.textContent = '+';
                plus.onclick = () => setQty(i, qty + 1);
                q.appendChild(minus); q.appendChild(inp); q.appendChild(plus);
                row.appendChild(q);

                const del = document.createElement('button');
                del.type = 'button'; del.className = 'cart-remove'; del.title = 'حذف'; del.textContent = '🗑️';
                del.onclick = () => removeItem(i);
                row.appendChild(del);

                box.appendChild(row);
            });

            document.getElementById('total-price').textContent = 'الإجمالي: ' + total.toLocaleString('en-US') + ' ج.م';
            const badge = document.getElementById('cartBadge');
            if (badge) badge.textContent = count;
        }
        window.addEventListener('load', renderCart);

        function checkoutOrder() {
            // بنقرأ من السلة الجديدة اللي اسمها epic_cart
            let cart = JSON.parse(localStorage.getItem('epic_cart')) || JSON.parse(localStorage.getItem('cart')) || [];

            if (cart.length === 0) {
                alert('سلة المشتريات فارغة! أضف منتجات أولاً قبل إتمام الطلب.');
                return;
            }
            window.location.href = 'checkout.html';
        }
    </script>
</body>

</html>
