        : productsDB.filter(p => p.category === cat);

    const availableContainer = document.getElementById('available-products');
    const outOfStockContainer = document.getElementById('out-of-stock-products');

    function renderProducts(productsToRender) {
        availableContainer.innerHTML = '';
        outOfStockContainer.innerHTML = '';

        productsToRender.forEach(product => {
            let cardHTML = '';
            if (product.inStock) {
                cardHTML = `
                    <a href="product.html?name=${product.name}" style="text-decoration: none; color: inherit; display: block; width: 100%;">

                        <span class="stock-badge in-stock">In Stock</span>
                        <div class="img-container">
                            <img src="${product.img}" class="product-img" onerror="this.src='../assets/images/keyboard-main.jpg'">
                        </div>
                        <div class="product-info">
                            <p>${product.name}</p>
                            <span>${product.price} EGP</span>
                            <button onclick="event.preventDefault(); addToCart('${product.name}', ${product.price})" style="margin-top: 10px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; padding: 6px 15px; border-radius: 20px; cursor: pointer; transition: 0.3s; font-size: 13px;">

                            </button>
                        </div>
                    </div>
                    </a>
                `;
                availableContainer.innerHTML += cardHTML;
            } else {
                cardHTML = `
                    <a href="product.html?name=${product.name}" style="text-decoration: none; color: inherit; display: block; width: 100%;">
                    <div class="product-card" style="width: 100%;">
                        <span class="stock-badge out-of-stock">Out of Stock</span>
                        <div class="img-container">
                            <img src="${product.img}" class="product-img" style="opacity: 0.5;" onerror="this.src='../assets/images/keyboard-main.jpg'">
                        </div>
                        <div class="product-info">
                            <p>${product.name}</p>
                            <span style="text-decoration: line-through; color: #888;">${product.price} EGP</span>
                            <button onclick="event.preventDefault();" disabled style="background: rgba(255, 255, 255, 0.02); color: #666; border: 1px solid rgba(255, 255, 255, 0.05); cursor: not-allowed; margin-top: 10px; padding: 6px 15px; border-radius: 20px; font-size: 13px;">
                                غير متوفر ❌
                            </button>
                        </div>
                    </div>
                    </a>
                `;
                outOfStockContainer.innerHTML += cardHTML;
            }
        });

        if(availableContainer.innerHTML === '') availableContainer.innerHTML = '<p style="color: #94a3b8; grid-column: 1/-1; text-align: center;">لا توجد منتجات متوفرة حالياً.</p>';
        if(outOfStockContainer.innerHTML === '') outOfStockContainer.innerHTML = '<p style="color: #94a3b8; grid-column: 1/-1; text-align: center;">لا توجد منتجات نفدت كميتها.</p>';
    }

    renderProducts(currentProductsList);

    function addToCart(name, price) {
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let existing = cart.find(item => item.name === name);
        if(existing) {
            existing.quantity += 1;
        } else {
            cart.push({ name, price, quantity: 1 });
        }
        localStorage.setItem('cart', JSON.stringify(cart));
        let totalItemsCount = cart.reduce((total, item) => total + item.quantity, 0);
        alert(`تم إضافة "${name}" إلى السلة بنجاح! ✔️\nإجمالي المنتجات في السلة: ${totalItemsCount}`);
    }

    function handleSearch(event) {
        if (event.key === 'Enter') {
            event.preventDefault(); 
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            const searchResult = currentProductsList.filter(p => 
                p.name.toLowerCase().includes(query) || 
                (p.specs && p.specs.toLowerCase().includes(query))
            );

            renderProducts(searchResult);
            document.getElementById('category-main-title').innerText = "نتائج البحث: " + query;
        }
    }
</script>
