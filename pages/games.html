    <style>
        /* إيقاف ألوان الـ RGB وأنيميشن الخلفية في هذه الصفحة فقط */
        body, html {
            background-color: #0f172a !important; /* لون كحلي ثابت فخم */
            background-image: none !important;
            animation: none !important;
            transition: none !important;
        }

        /* إيقاف أي تأثيرات إضاءة متضافة كطبقة تانية في الخلفية */
        body::before, body::after, main::before, main::after {
            display: none !important;
            animation: none !important;
            background: none !important;
            opacity: 0 !important;
        }
        /* تنسيقات مكتبة الألعاب */
        .games-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        @media (min-width: 768px) {
            .games-layout { grid-template-columns: 3fr 1fr; } /* تقسيم الشاشة: الألعاب يمين والسلة شمال */
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        
/* تنسيقات كروت الألعاب (تأثير الزجاج الشفاف المعزول عن الـ RGB) */
        .game-card {
            background: rgba(0, 0, 0, 0.4) !important; /* خلفية سوداء شفافة */
            backdrop-filter: blur(10px) !important; /* تأثير الزجاج */
            -webkit-backdrop-filter: blur(10px) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important; /* إطار أبيض خفيف جداً */
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3) !important; /* ظل أسود عادي بدون ألوان */
            animation: none !important; /* إيقاف أي أنيميشن ألوان */
        }

        .game-card:hover {
            border-color: rgba(255, 255, 255, 0.3) !important;
            transform: translateY(-5px);
            background: rgba(0, 0, 0, 0.6) !important;
        }

        .game-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .game-card h4 { color: #fff !important; margin-bottom: 5px; font-size: 16px; text-shadow: none !important; }
        .game-card p { color: #94a3b8 !important; font-size: 14px; margin-bottom: 10px; text-shadow: none !important; }
        
        .add-game-btn {
            background: rgba(255, 255, 255, 0.05) !important;
            color: #fff !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: none !important;
        }
        .add-game-btn:hover { 
            background: #fff !important; 
            color: #000 !important; 
        }
        
        /* تنسيقات سلة الألعاب (شفافة ومعزولة) */
        .games-cart {
            background: rgba(0, 0, 0, 0.4) !important;
            backdrop-filter: blur(10px) !important;
            -webkit-backdrop-filter: blur(10px) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 10px;
            padding: 20px;
            position: sticky;
            top: 20px;
            height: fit-content;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3) !important;
            animation: none !important;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05) !important; /* شفافية خفيفة لعناصر السلة */
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            font-size: 14px;
            color: white !important;
            box-shadow: none !important;
        }

        .remove-btn {
            background: rgba(239, 68, 68, 0.8) !important;
            color: white !important;
            border: none !important;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            box-shadow: none !important;
        }        
        .epic-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 5px;
            outline: none;
        }
    </style>

        // 2. دالة رسم الألعاب في الشاشة (بصور مؤقتة)
        function renderGames(gamesArray) {
            const container = document.getElementById('gamesContainer');
            container.innerHTML = '';
            
            gamesArray.forEach(game => {
                const imgId = `img-${game.id}`;
                // صورة مؤقتة مكتوب عليها جاري التحميل
                const loadingImg = `https://placehold.co/300x150/0f172a/38bdf8?text=${encodeURIComponent('جاري جلب الغلاف...')}`;
                
                container.innerHTML += `
                    <div class="game-card">
                        <img id="${imgId}" src="${loadingImg}" alt="${game.name}" style="object-fit: cover;">
                        <h4>${game.name}</h4>
                        <p>المساحة: ${game.size} GB</p>
                        <button class="add-game-btn" onclick="addToGamesCart('${game.name}', ${game.size})">➕ إضافة للسلة</button>
                    </div>
                `;
            });

            // بنشغل السكريبت اللي بيجيب الصور من ستيم بالدور
            fetchImagesSafely(gamesArray);
        }

        // 3. الدالة السحرية (بتجيب الصور واحدة واحدة عشان ستيم ميعملش بلوك)
        async function fetchImagesSafely(gamesArray) {
            for (let game of gamesArray) {
                const imgElement = document.getElementById(`img-${game.id}`);
                if (!imgElement) continue;

                try {
                    // بيبحث في النت عن اللعبة
                    const response = await fetch(`https://www.cheapshark.com/api/1.0/games?title=${encodeURIComponent(game.name)}&limit=1`);
                    const data = await response.json();
                    
                    if (data && data.length > 0) {
                        if (data[0].steamAppID) {
                            // بيسحب الغلاف الأصلي من سيرفرات ستيم
                            imgElement.src = `https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/${data[0].steamAppID}/header.jpg`;
                        } else if (data[0].thumb) {
                            // لو ملهاش غلاف في ستيم، بيجيب أي غلاف ليها من النت
                            imgElement.src = data[0].thumb;
                        } else {
                            imgElement.src = `https://placehold.co/300x150/0f172a/38bdf8?text=${encodeURIComponent(game.name)}`;
                        }
                    } else {
                        // لو اللعبة مش موجودة عالنت أصلاً، هيكتب اسمها
                        imgElement.src = `https://placehold.co/300x150/0f172a/38bdf8?text=${encodeURIComponent(game.name)}`;
                    }
                } catch (error) {
                    imgElement.src = `https://placehold.co/300x150/0f172a/38bdf8?text=${encodeURIComponent(game.name)}`;
                }
                
                // التركة هنا: بننيم الكود نص ثانية قبل ما يجيب الصورة اللي بعدها عشان السيرفر ميطردناش
                await new Promise(resolve => setTimeout(resolve, 600));
            }
        }

        // 4. دالة إضافة اللعبة للسلة
        function addToGamesCart(name, size) {
            const exists = selectedGames.find(g => g.name === name);
            if (exists) {
                alert('اللعبة دي موجودة في السلة بالفعل!');
                return;
            }
            selectedGames.push({ name, size });
            updateCartUI();
        }

        // 5. دالة حذف اللعبة من السلة
        function removeFromGamesCart(name) {
            selectedGames = selectedGames.filter(g => g.name !== name);
            updateCartUI();
        }

        // 6. تحديث شكل السلة والمساحة
        function updateCartUI() {
            const listContainer = document.getElementById('selectedGamesList');
            const totalElement = document.getElementById('totalSize');
            
            if (selectedGames.length === 0) {
                listContainer.innerHTML = '<p style="color: #94a3b8; text-align: center; font-size: 14px;">لم يتم اختيار ألعاب بعد.</p>';
                totalElement.innerText = '0';
                return;
            }

            listContainer.innerHTML = '';
            let totalSize = 0;

            selectedGames.forEach(game => {
                totalSize += game.size;
                listContainer.innerHTML += `
                    <div class="cart-item">
                        <span style="font-size: 12px; font-weight: bold;">${game.name}</span>
                        <div>
                            <span style="color: #38bdf8; font-size: 12px; margin-right: 5px;">${game.size}GB</span>
                            <button class="remove-btn" onclick="removeFromGamesCart('${game.name}')">X</button>
                        </div>
                    </div>
                `;
            });
            totalElement.innerText = totalSize.toFixed(2);
        }

        // 7. دالة البحث
        function filterGames() {
            const searchTerm = document.getElementById('gameSearch').value.toLowerCase();
            const filtered = gamesDB.filter(game => game.name.toLowerCase().includes(searchTerm));
            renderGames(filtered);
        }

        // 8. إرسال الطلب واتساب
        document.getElementById('gameOrderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (selectedGames.length === 0) {
                alert('لازم تختار لعبة واحدة على الأقل قبل الطلب!');
                return;
            }
            const name = document.getElementById('customerName').value;
            const totalSpace = document.getElementById('totalSize').innerText;
            const storePhone = "201017229055"; 
            const gamesListText = selectedGames.map(g => `🎮 ${g.name} (${g.size}GB)`).join('%0A');
            const message = `أهلاً EPIC TECH، محتاج أحمل الألعاب دي:%0A%0A👤 الاسم: ${name}%0A📦 إجمالي المساحة: ${totalSpace} GB%0A%0Aالألعاب المطلوبة:%0A${gamesListText}`;
            window.open(`https://wa.me/${storePhone}?text=${message}`, '_blank');
        });

        // تشغيل الموقع ورسم الألعاب أول ما الصفحة تفتح
        renderGames(gamesDB);
